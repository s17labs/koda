# Auto-labels pull requests with a size label based on changed lines.
# Labels: size:S (<10), size:M (<100), size:L (<500), size:XL (<1000), size:XXL (>=1000)
name: PR Size

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write

jobs:
  label:
    name: Add size label
    runs-on: ubuntu-latest
    steps:
      - name: Compute diff and label
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const changed = files.reduce(
              (sum, f) => sum + f.additions + f.deletions,
              0,
            );

            const sizes = [
              { max: 10, label: "size:S" },
              { max: 100, label: "size:M" },
              { max: 500, label: "size:L" },
              { max: 1000, label: "size:XL" },
              { max: Infinity, label: "size:XXL" },
            ];
            const label = sizes.find((s) => changed < s.max).label;

            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: [label],
            });
